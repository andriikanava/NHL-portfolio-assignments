<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <div class="mondrian" role="img" aria-label="Mondriaan style composition">
        <div class="tile" style="grid-column: 1 / span 2; grid-row: 1;"></div>
        <div class="tile" style="grid-column: 3 / span 4; grid-row: 1;"></div>
        <div class="tile yellow" style="grid-column: 7 / span 4; grid-row: 1;"></div>
        <div class="tile" style="grid-column: 11 / span 1; grid-row: 1 / span 8;"></div>

        <div class="tile" style="grid-column: 1 / span 1; grid-row: 2 / span 3;"></div>
        <div class="tile red" style="grid-column: 2 / span 5; grid-row: 2 / span 5;"></div>
        <div class="tile yellow" style="grid-column: 7 / span 4; grid-row: 2 / span 3;"></div>

        <div class="tile" style="grid-column: 1 / span 1; grid-row: 5 / span 4;"></div>
        <div class="tile" style="grid-column: 7 / span 2; grid-row: 5 / span 2;"></div>
        <div class="tile" style="grid-column: 9 / span 2; grid-row: 5 / span 2;"></div>

        <div class="tile black" style="grid-column: 2 / span 3; grid-row: 7 / span 3;"></div>
        <div class="tile" style="grid-column: 5 / span 2; grid-row: 7 / span 1;"></div>
        <div class="tile" style="grid-column: 5 / span 2; grid-row: 8 / span 1;"></div>
        <div class="tile" style="grid-column: 7 / span 4; grid-row: 7 / span 1;"></div>
        <div class="tile blue" style="grid-column: 7 / span 4; grid-row: 8 / span 3;"></div>

        <div class="tile yellow" style="grid-column: 1 / span 1; grid-row: 9 / span 3;"></div>
        <div class="tile" style="grid-column: 2 / span 3; grid-row: 10 / span 2;"></div>
        <div class="tile black" style="grid-column: 5 / span 2; grid-row: 10 / span 1;"></div>

        <div class="tile" style="grid-column: 5 / span 6; grid-row: 11 / span 1;"></div>
        <div class="tile red" style="grid-column: 11 / span 1; grid-row: 9 / span 3;"></div>
        
    </div>
</body>
</html>
